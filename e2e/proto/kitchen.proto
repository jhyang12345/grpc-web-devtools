// Fixture service for the real-library end-to-end suites (src/__tests__/e2e*.test.js).
// It deliberately covers every protobuf field shape the inspector must render,
// serialize, and replay. Regenerate client code with `npm run e2e:generate`.
syntax = "proto3";

package inspector.e2e;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message Nested {
  string label = 1;
  int32 weight = 2;
}

// Packed into KitchenSink.attachment to exercise google.protobuf.Any.
message Note {
  string text = 1;
}

message KitchenSink {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color color = 16;
  Nested nested = 17;
  repeated string tags = 18;
  repeated int32 numbers = 19;
  repeated Nested items = 20;
  map<string, string> labels = 21;
  map<int32, Nested> nested_by_id = 22;
  oneof choice {
    string choice_text = 23;
    int32 choice_number = 24;
    Nested choice_nested = 25;
  }
  optional string maybe = 26;
  google.protobuf.Timestamp created_at = 27;
  google.protobuf.StringValue wrapped_name = 28;
  google.protobuf.Int64Value wrapped_count = 29;
  google.protobuf.Any attachment = 30;
  google.protobuf.Struct metadata = 31;
  google.protobuf.Duration ttl = 32;
}

message EchoRequest {
  KitchenSink sink = 1;
  // Server behavior: "ok", "grpc-error", "network-error", "trailers-only".
  string scenario = 2;
  // Streams: number of messages to send. For "grpc-error" streams, the
  // failure status follows this many messages (0 = fail before any message).
  int32 count = 3;
  // gRPC status code used by the "grpc-error" scenario.
  int32 error_code = 4;
}

message EchoResponse {
  KitchenSink sink = 1;
  int32 index = 2;
  string server_note = 3;
}

service KitchenService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Stream(EchoRequest) returns (stream EchoResponse);
}
